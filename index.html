<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOC Triage</title>
<style>
  :root{
    --bg:#01030d; --surface:#0a1525; --surface-2:#0f1d33; --surface-3:#07101e;
    --border:#1e3050; --border-2:#162540;
    --text:#e6ecf5; --muted:#7c8aa3; --muted-2:#5b677b;
    --accent:#4f8cff;
    --crit:#ef4444; --high:#f97316; --med:#eab308; --low:#22c55e; --info:#06b6d4;
    --mitre:#a855f7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(0, 255, 255, 0.12), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(0, 200, 255, 0.12), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(0, 150, 200, 0.08), transparent 60%),
      #03080e;
    background-attachment: fixed;
    color:var(--text);
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
    font-size:13px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ==================== HEADER ==================== */
  header{
    display:flex; align-items:center; gap:16px;
    padding:0 20px; height:56px;
    background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{
    font-weight:600; font-size:14px; color:var(--text);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .brand .logo{
    width:22px; height:22px; border-radius:6px;
    background:linear-gradient(135deg, var(--accent), var(--mitre));
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff;
  }

  .view-tabs{display:flex; gap:2px; background:var(--surface-2); border-radius:8px; padding:3px}
  .view-tab{
    background:none; border:none; color:var(--muted);
    padding:6px 14px; font-size:12.5px; font-weight:500;
    border-radius:6px; cursor:pointer; transition:all .15s;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .view-tab:hover{color:var(--text)}
  .view-tab.active{background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .view-tab .count{
    font-size:10.5px; padding:1px 6px; border-radius:99px;
    background:var(--surface-3); color:var(--muted); font-weight:600;
  }
  .view-tab.active .count{background:rgba(79,140,255,.16); color:#93b8ff}

  .filters{display:flex; gap:6px; align-items:center; margin-left:auto}
  .filter-pill{
    display:flex; align-items:center; gap:5px;
    background:var(--surface-2); border:1px solid transparent;
    color:var(--muted); font-size:11.5px; padding:4px 10px;
    border-radius:99px; cursor:pointer; transition:all .15s;
  }
  .filter-pill:hover{color:var(--text)}
  .filter-pill.on{
    background:rgba(79,140,255,.12);
    border-color:rgba(79,140,255,.35);
    color:#93b8ff;
  }
  .filter-pill button{
    background:none; border:none; color:inherit;
    font-size:12px; cursor:pointer; padding:0 0 0 2px; line-height:1;
    opacity:.6;
  }
  .filter-pill button:hover{opacity:1}

  .status-indicator{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--muted);
  }
  .status-indicator .dot{
    width:6px; height:6px; border-radius:50%; background:var(--low);
    box-shadow:0 0 6px var(--low);
  }

  .live-badge{
    padding:3px 10px; border-radius:99px;
    font-size:10.5px; font-weight:600; letter-spacing:.03em;
    transition:all .3s;
  }
  .live-badge.online{
    background:rgba(34,197,94,.14); color:#4ade80;
    box-shadow:0 0 8px rgba(34,197,94,.35);
  }
  .live-badge.demo{background:rgba(79,140,255,.14); color:#93b8ff}
  .live-badge.offline{background:rgba(239,68,68,.14); color:#f87171}

  /* ==================== LAYOUT ==================== */
  .main-container{display:flex; flex:1; overflow:hidden}
  .table-area{
    flex:1; overflow-y:auto; padding:16px 20px;
    transition:margin-right .25s ease;
  }
  .table-area.shrink{margin-right:460px}

  table{width:100%; border-collapse:collapse}
  thead th{
    text-align:left; padding:10px 12px;
    font-size:10.5px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:var(--muted-2);
    border-bottom:1px solid var(--border);
    background:var(--bg); position:sticky; top:0; z-index:10;
    user-select:none; white-space:nowrap; vertical-align:middle;
  }
  thead th.sortable{cursor:pointer}
  thead th.sortable:hover .th-label{color:var(--text)}
  .th-inner{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .th-label{display:flex; align-items:center; gap:3px; transition:color .15s}
  .sort-ind{font-size:9px; opacity:.35}
  thead th.sort-active .sort-ind{opacity:1; color:var(--accent)}
  thead th.sort-active .th-label{color:var(--accent)}

  .hdr-filter{position:relative}
  .hdr-filter-btn{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:5px; color:var(--muted);
    padding:3px 7px; font-size:10px; cursor:pointer;
    display:flex; align-items:center; gap:4px;
    text-transform:none; letter-spacing:0; font-weight:500;
    transition:all .15s;
  }
  .hdr-filter-btn:hover{border-color:var(--accent); color:var(--text)}
  .hdr-filter-btn.active{
    background:rgba(79,140,255,.14); border-color:var(--accent); color:#93b8ff;
  }
  .hdr-filter-btn .caret{font-size:8px; opacity:.6}
  .hdr-filter-menu{
    position:absolute; top:100%; left:0; margin-top:6px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:5px; min-width:170px;
    box-shadow:0 12px 32px rgba(0,0,0,.55); z-index:50;
    display:none;
  }
  .hdr-filter-menu.show{display:block}
  .fm-item{
    display:flex; align-items:center; gap:8px;
    padding:6px 8px; border-radius:5px; font-size:12px;
    cursor:pointer; color:var(--text); white-space:nowrap;
  }
  .fm-item:hover{background:var(--surface-3)}
  .fm-item.sel{color:#93b8ff; font-weight:500}
  .fm-item .chk{width:12px; font-size:11px; color:var(--accent)}
  .fm-sep{height:1px; background:var(--border); margin:4px 2px}
  .fm-clear{
    font-size:11px; color:var(--muted); text-align:center;
    padding:6px; cursor:pointer; border-top:1px solid var(--border);
    margin-top:4px;
  }
  .fm-clear:hover{color:var(--crit)}

  .title-search{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:5px; color:var(--text); padding:4px 8px;
    font-size:11px; outline:none; width:110px;
    text-transform:none; letter-spacing:0; font-weight:400;
    transition:all .15s;
  }
  .title-search:focus{border-color:var(--accent); width:160px}
  .title-search::placeholder{color:var(--muted-2)}

  tbody tr{
    border-bottom:1px solid var(--border-2);
    cursor:pointer; transition:background .12s;
  }
  tbody tr:hover{background:rgba(255,255,255,.015)}
  tbody tr.selected{background:rgba(79,140,255,.06)}
  tbody tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  tbody tr.selected.case-row{background:rgba(244,63,94,.05)}
  tbody tr.selected.case-row td:first-child{box-shadow:inset 3px 0 0 #f43f5e}
  tbody tr.ti-match td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
  tbody tr.ti-match{background:rgba(239,68,68,.04)}
  td{padding:11px 12px; vertical-align:middle}

  /* ==================== BADGES ==================== */
  .sev-badge{
    display:inline-block; padding:2px 8px; border-radius:4px;
    font-size:10.5px; font-weight:600; letter-spacing:.02em;
    text-transform:uppercase;
  }
  .sev-badge.Critical{background:rgba(239,68,68,.14); color:#f87171}
  .sev-badge.High{background:rgba(249,115,22,.14); color:#fb923c}
  .sev-badge.Medium{background:rgba(234,179,8,.14); color:#facc15}
  .sev-badge.Low{background:rgba(34,197,94,.14); color:#4ade80}
  .sev-badge.Info{background:rgba(6,182,212,.14); color:#22d3ee}

  .status-badge{
    display:inline-block; padding:2px 8px; border-radius:4px;
    font-size:10.5px; font-weight:500; white-space:nowrap;
  }
  .status-badge.New{background:rgba(79,140,255,.13); color:#93b8ff}
  .status-badge.In-Progress{background:rgba(249,115,22,.13); color:#fdba74}
  .status-badge.Escalated{background:rgba(239,68,68,.13); color:#fca5a5}
  .status-badge.Closed{background:rgba(107,114,128,.13); color:#9ca3af}
  .status-badge.Open{background:rgba(244,63,94,.13); color:#fda4af}
  .status-badge.Contained{background:rgba(168,85,247,.13); color:#d8b4fe}

  .case-badge{
    display:inline-block; padding:1px 6px; border-radius:4px;
    font-family:'SF Mono','Menlo',monospace;
    font-size:10.5px; font-weight:600;
    background:rgba(244,63,94,.12); color:#fda4af;
  }
  .link-count{
    display:inline-block; padding:1px 7px; border-radius:99px;
    font-size:10.5px; font-weight:600;
    background:rgba(168,85,247,.13); color:#d8b4fe;
  }
  .mitre-tag{
    display:inline-block; padding:2px 6px; margin:1px 3px 1px 0;
    border-radius:4px; font-family:'SF Mono','Menlo',monospace;
    font-size:10px; font-weight:600;
    background:rgba(168,85,247,.11); color:#d8b4fe;
  }

  /* ==================== RIGHT PANEL ==================== */
  .details-panel{
    width:460px; background:var(--surface);
    border-left:1px solid var(--border);
    display:flex; flex-direction:column;
    position:fixed; right:-460px; top:56px; bottom:0;
    transition:right .25s ease; z-index:100;
    box-shadow:-8px 0 32px rgba(0,0,0,.4);
  }
  .details-panel.open{right:0}

  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .panel-header h3{
    margin:0; font-size:13px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .panel-close{
    background:none; border:none; color:var(--muted);
    font-size:16px; cursor:pointer; padding:2px 6px;
    border-radius:5px; transition:all .15s;
  }
  .panel-close:hover{background:var(--surface-2); color:var(--text)}

  .panel-tabs{
    display:flex; border-bottom:1px solid var(--border);
    padding:0 12px; overflow-x:auto; scrollbar-width:none;
    flex-shrink:0;
  }
  .panel-tabs::-webkit-scrollbar{display:none}
  .tab{
    background:none; border:none; color:var(--muted);
    padding:11px 12px; font-size:12px; font-weight:500;
    cursor:pointer; border-bottom:2px solid transparent;
    margin-bottom:-1px; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
    transition:all .15s;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text); border-bottom-color:var(--accent)}
  .tab .badge{
    font-size:9px; padding:1px 5px; border-radius:99px;
    background:rgba(168,85,247,.2); color:#d8b4fe; font-weight:700;
  }

  .panel-body{flex:1; overflow-y:auto; padding:18px}

  .section{margin-bottom:20px}
  .section:last-child{margin-bottom:0}
  .section-title{
    display:flex; align-items:center; justify-content:space-between;
    font-size:10.5px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted-2);
    margin:0 0 10px;
  }
  .section-title .meta{
    text-transform:none; letter-spacing:0;
    font-weight:400; color:var(--muted); font-size:11px;
  }

  .row{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:12.5px}
  .row .label{color:var(--muted); flex-shrink:0}
  .row .value{font-weight:500; text-align:right; word-break:break-word}

  /* Toggles */
  .toggle-group{
    display:flex; background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px;
    padding:3px; gap:2px;
  }
  .toggle-group button{
    flex:1; background:none; border:none; color:var(--muted);
    padding:7px 6px; font-size:11px; font-weight:500;
    border-radius:6px; cursor:pointer; transition:all .12s;
    white-space:nowrap;
  }
  .toggle-group button:hover{color:var(--text)}
  .toggle-group button.active.New{background:rgba(79,140,255,.18); color:#93b8ff}
  .toggle-group button.active.In-Progress{background:rgba(249,115,22,.18); color:#fdba74}
  .toggle-group button.active.Escalated{background:rgba(239,68,68,.18); color:#fca5a5}
  .toggle-group button.active.Closed{background:rgba(107,114,128,.18); color:#cbd5e1}
  .toggle-group button.active.Open{background:rgba(244,63,94,.18); color:#fda4af}
  .toggle-group button.active.Contained{background:rgba(168,85,247,.18); color:#d8b4fe}

  .verdict-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .verdict-grid button{
    padding:8px 10px; border-radius:7px; font-size:11.5px;
    font-weight:500; cursor:pointer;
    border:1px solid var(--border); background:var(--surface-2);
    color:var(--muted); transition:all .12s;
  }
  .verdict-grid button:hover{color:var(--text); border-color:var(--muted-2)}
  .verdict-grid button.active.TP{background:rgba(239,68,68,.13); border-color:rgba(239,68,68,.4); color:#fca5a5}
  .verdict-grid button.active.FP{background:rgba(107,114,128,.13); border-color:rgba(107,114,128,.4); color:#cbd5e1}
  .verdict-grid button.active.Benign{background:rgba(34,197,94,.13); border-color:rgba(34,197,94,.4); color:#86efac}
  .verdict-grid button.active.Suspicious{background:rgba(249,115,22,.13); border-color:rgba(249,115,22,.4); color:#fdba74}

  /* Escalation actions */
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px}

  /* Comment bar */
  .comment-bar{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:10px;
  }
  .comment-input-row{display:flex; gap:9px; align-items:flex-start}
  .avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--mitre));
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:#fff;
  }
  .comment-input{
    flex:1; background:var(--surface); border:1px solid var(--border);
    border-radius:7px; color:var(--text);
    padding:8px 10px; font-size:12px; outline:none;
    font-family:inherit; resize:none; min-height:36px;
    line-height:1.45; transition:border-color .15s;
  }
  .comment-input:focus{border-color:var(--accent)}
  .comment-input::placeholder{color:var(--muted-2)}
  .comment-toolbar{
    display:flex; justify-content:space-between; align-items:center;
    gap:8px; margin-top:9px; flex-wrap:wrap;
  }
  .comment-toolbar .left{display:flex; gap:4px}
  .tag-btn{
    background:var(--surface); border:1px solid var(--border);
    color:var(--muted); padding:3px 9px; border-radius:5px;
    font-size:10.5px; cursor:pointer; transition:all .12s;
  }
  .tag-btn:hover{color:var(--text)}
  .tag-btn.on{background:rgba(79,140,255,.15); border-color:var(--accent); color:#93b8ff}
  .tag-btn.on.tag-action{background:rgba(249,115,22,.15); border-color:var(--high); color:#fdba74}
  .tag-btn.on.tag-evidence{background:rgba(168,85,247,.15); border-color:var(--mitre); color:#d8b4fe}

  .comment-list{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .comment{
    background:var(--surface-2); border-radius:8px;
    padding:10px 12px; border-left:2px solid var(--accent);
  }
  .comment.action{border-left-color:var(--high)}
  .comment.evidence{border-left-color:var(--mitre)}
  .comment.pinned{border-left-color:var(--med)}
  .comment-head{
    display:flex; justify-content:space-between; align-items:center;
    gap:8px; margin-bottom:5px;
  }
  .comment-author{
    display:flex; align-items:center; gap:7px;
    font-size:11.5px; font-weight:600;
  }
  .comment-author .avatar{width:18px; height:18px; font-size:8px}
  .comment-time{font-size:10.5px; color:var(--muted-2)}
  .comment-body{font-size:12px; line-height:1.55; color:#d2dae6; word-break:break-word}
  .comment-tags{display:flex; gap:4px; margin-top:6px; flex-wrap:wrap}
  .ctag{
    font-size:9px; padding:1px 6px; border-radius:3px;
    font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  }
  .ctag.note{background:rgba(79,140,255,.13); color:#93b8ff}
  .ctag.action{background:rgba(249,115,22,.13); color:#fdba74}
  .ctag.evidence{background:rgba(168,85,247,.13); color:#d8b4fe}
  .ctag.pinned{background:rgba(234,179,8,.13); color:#fde047}
  .comment-actions{display:flex; gap:4px; margin-top:7px}
  .ca-btn{
    background:none; border:none; color:var(--muted-2);
    font-size:10.5px; cursor:pointer; padding:2px 6px;
    border-radius:4px; transition:all .12s;
  }
  .ca-btn:hover{background:var(--surface-3); color:var(--text)}

  /* Case panel */
  .case-panel{
    background:linear-gradient(135deg, rgba(244,63,94,.05), rgba(168,85,247,.03));
    border:1px solid rgba(244,63,94,.25);
    border-radius:10px; padding:14px;
  }
  .case-id{
    display:inline-block; padding:3px 10px;
    background:rgba(244,63,94,.13); border:1px solid rgba(244,63,94,.3);
    color:#fda4af; border-radius:5px;
    font-family:'SF Mono','Menlo',monospace;
    font-size:11.5px; font-weight:700; margin-bottom:14px;
  }
  .field{margin-bottom:11px}
  .field label{
    display:block; font-size:10.5px; font-weight:600;
    letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted-2); margin-bottom:5px;
  }
  .field input,.field select,.field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border);
    color:var(--text); border-radius:6px; padding:7px 10px;
    font-size:12px; outline:none; font-family:inherit;
    transition:border-color .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical; min-height:56px}

  .timeline{padding-left:14px; margin-top:6px; border-left:2px solid var(--border-2)}
  .timeline-item{
    position:relative; font-size:11.5px; color:var(--muted);
    margin-bottom:9px; line-height:1.45;
  }
  .timeline-item:before{
    content:''; position:absolute; left:-19px; top:5px;
    width:5px; height:5px; border-radius:50%; background:#f43f5e;
  }
  .timeline-item b{color:var(--text); font-weight:600}

  .chip-list{display:flex; flex-wrap:wrap; gap:5px}
  .chip{
    padding:3px 9px; border-radius:99px; font-size:11px;
    cursor:pointer; transition:all .12s;
    background:rgba(79,140,255,.1); color:#93b8ff;
    font-family:'SF Mono','Menlo',monospace;
  }
  .chip:hover{background:rgba(79,140,255,.2)}

  .empty-case{
    text-align:center; padding:24px 16px;
    background:var(--surface-2); border-radius:8px;
    border:1px dashed var(--border);
    color:var(--muted); font-size:12px; line-height:1.6;
  }
  .empty-case b{color:#fca5a5}

  /* IOC cards */
  .ioc{
    background:var(--surface-2); border-radius:9px;
    overflow:hidden; margin-bottom:10px;
    border-left:3px solid var(--muted-2);
  }
  .ioc.malicious{border-left-color:var(--crit)}
  .ioc.suspicious{border-left-color:var(--high)}
  .ioc.clean{border-left-color:var(--low)}
  .ioc.private{border-left-color:var(--muted-2)}
  .ioc-head{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; cursor:pointer;
    transition:background .12s;
  }
  .ioc-head:hover{background:var(--surface-3)}
  .ioc-head .ico{font-size:14px; flex-shrink:0; opacity:.8}
  .ioc-head .val{
    flex:1; min-width:0; font-family:'SF Mono','Menlo',monospace;
    font-size:11.5px; word-break:break-all;
  }
  .ioc-head .field-name{
    font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted-2); margin-top:1px;
  }
  .ioc-verdict{
    font-size:9.5px; font-weight:700; padding:2px 7px;
    border-radius:4px; letter-spacing:.03em; text-transform:uppercase;
    white-space:nowrap;
  }
  .ioc-verdict.malicious{background:rgba(239,68,68,.15); color:#f87171}
  .ioc-verdict.suspicious{background:rgba(249,115,22,.15); color:#fb923c}
  .ioc-verdict.clean{background:rgba(34,197,94,.15); color:#4ade80}

const WORKER_URL = 'https://royal-waterfall-0d99.triage-yourdomaincom.workers.dev';
let liveMode = false;

async function fetchLiveAlerts() {
  try {
    const res = await fetch(`${WORKER_URL}/api/alerts?limit=200`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const liveAlerts = await res.json();
    if (!Array.isArray(liveAlerts)) throw new Error('Invalid response');

    liveAlerts.forEach(la => {
      const idx = ALERTS.findIndex(a => a.id === la.id);
      const normalized = {
        id:       la.id,
        company:  la.company  || 'Unknown',
        title:    la.title    || 'Unnamed',
        sev:      la.sev      || 'Medium',
        created:  la.created  || '',
        status:   la.status   || 'New',
        user:     la.user     || '',
        rule:     la.rule     || '',
        src_ip:   la.src_ip   || '',
        dst_ip:   la.dst_ip   || '',
        host:     la.host     || '',
        hash:     la.hash     || '',
        domain:   la.domain   || '',
        mitre:    Array.isArray(la.mitre) ? la.mitre : [],
        sensor:   la.sensor   || 'SIEM',
        risk:     la.risk     || 50,
        _live:    true,
      };
      if (idx === -1) ALERTS.unshift(normalized);
      else ALERTS[idx] = normalized;
    });

    liveMode = true;
    updateLiveIndicator(liveAlerts.length);
    renderView();
  } catch (e) {
    console.error('[Live fetch failed]', e);
    liveMode = false;
    updateLiveIndicator(0, true);
  }
}

function updateLiveIndicator(count, errored = false) {
  const el = document.getElementById('liveBadge');
  if (!el) return;
  if (errored) {
    el.className = 'live-badge offline';
    el.textContent = '● Live (offline)';
  } else if (liveMode) {
    el.className = 'live-badge online';
    el.textContent = `● Live · ${count} alert${count === 1 ? '' : 's'}`;
  } else {
    el.className = 'live-badge demo';
    el.textContent = '● Demo mode';
  }
}

async function pushUpdate(alertId, patch) {
  if (!liveMode) return;
  try {
    await fetch(`${WORKER_URL}/api/alerts/${alertId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    });
  } catch (e) {
    console.warn('[Push failed]', e);
  }
}

    if(activeCompanies.size && !activeCompanies.has(a.company)) return false;
    if(activeSevs.size && !activeSevs.has(a.sev)) return false;
    if(q && !a.title.toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a,b)=>{
    let va, vb;
    switch(sortKey){
      case 'company': va=a.company.toLowerCase(); vb=b.company.toLowerCase(); break;
      case 'title':   va=a.title.toLowerCase();   vb=b.title.toLowerCase(); break;
      case 'sev':     va=SEV_ORDER[a.sev]||0;      vb=SEV_ORDER[b.sev]||0;  break;
      case 'mitre':   va=(a.mitre[0]||'');         vb=(b.mitre[0]||'');     break;
      case 'status':  va=STATUS_ORDER[a.status]||0;vb=STATUS_ORDER[b.status]||0; break;
      default:        va=a.created; vb=b.created;
    }
    if(va<vb) return sortDir==='asc'?-1:1;
    if(va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}
function getFilteredCases(){
  const q = titleSearch.toLowerCase();
  let list = Object.values(cases).filter(c=>{
    if(activeCompanies.size && !activeCompanies.has(c.company)) return false;
    if(activeSevs.size && !activeSevs.has(c.sev)) return false;
    if(q && !c.title.toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a,b)=>{
    let va, vb;
    switch(sortKey){
      case 'company': va=a.company.toLowerCase(); vb=b.company.toLowerCase(); break;
      case 'title':   va=a.title.toLowerCase();   vb=b.title.toLowerCase(); break;
      case 'sev':     va=SEV_ORDER[a.sev]||0;      vb=SEV_ORDER[b.sev]||0;  break;
      case 'mitre':   va=(a.mitre[0]||'');         vb=(b.mitre[0]||'');     break;
      case 'owner':   va=(a.owner||'').toLowerCase(); vb=(b.owner||'').toLowerCase(); break;
      case 'linked':  va=a.linked.length;          vb=b.linked.length;      break;
      case 'status':  va=STATUS_ORDER[a.status]||0;vb=STATUS_ORDER[b.status]||0; break;
      case 'caseId':  va=a.caseId;                 vb=b.caseId; break;
      default:        va=a.created; vb=b.created;
    }
    if(va<vb) return sortDir==='asc'?-1:1;
    if(va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}

/* ==================== 12. TABLE RENDER ==================== */
function renderView(){
  document.getElementById('alertsCount').textContent = getFilteredAlerts().length;
  document.getElementById('casesCount').textContent = Object.keys(cases).length;
  renderActiveFilterPills();
  renderTableHead();
  const tbody = document.getElementById('alertTableBody');

  if(currentView === 'alerts'){
    const list = getFilteredAlerts();
    if(!list.length){
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">No alerts match the current filter.</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(a=>{
      const hasCase = !!cases[a.id];
      const sel = selectedAlertId===a.id ? 'selected' : '';
      const checked = selectedRows.has(a.id) ? 'checked' : '';
      return `
        <tr class="${sel}" data-id="${a.id}">
          <td onclick="event.stopPropagation()"><input type="checkbox" data-row-check="${a.id}" ${checked} /></td>
          <td>${esc(a.company)}${hasCase?` <span class="case-badge">📁</span>`:''}</td>
          <td>${esc(a.title)}</td>
          <td><span class="sev-badge ${a.sev}">${a.sev}</span></td>
          <td>${mitreTagsHTML(a.mitre)}</td>
          <td style="font-family:'SF Mono',monospace;font-size:11px;color:var(--muted)">${esc(a.created)}</td>
          <td><span class="status-badge ${a.status.replace(' ','-')}">${a.status}</span></td>
        </tr>`;
    }).join('');
    tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
      tr.addEventListener('click', ()=>selectAlert(tr.dataset.id));
    });
    tbody.querySelectorAll('[data-row-check]').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const id = cb.dataset.rowCheck;
        e.target.checked ? selectedRows.add(id) : selectedRows.delete(id);
      });
    });
  } else {
    const list = getFilteredCases();
    if(!list.length){
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--muted)">No cases match the current filter.</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(c=>{
      const sel = selectedCaseId===c.caseId ? 'selected case-row' : '';
      return `
        <tr class="${sel}" data-case-id="${esc(c.caseId)}">
          <td><span class="case-badge">${esc(c.caseId)}</span></td>
          <td>${esc(c.company)}</td>
          <td>${esc(c.title)}</td>
          <td><span class="sev-badge ${c.sev}">${c.sev}</span></td>
          <td>${mitreTagsHTML(c.mitre)}</td>
          <td style="font-family:'SF Mono',monospace;font-size:11px;color:var(--muted)">${esc(c.created)}</td>
          <td>${esc(c.owner)}</td>
          <td><span class="status-badge ${c.status.replace(' ','-')}">${c.status}</span></td>
          <td><span class="link-count">${c.linked.length}</span></td>
        </tr>`;
    }).join('');
    tbody.querySelectorAll('tr[data-case-id]').forEach(tr=>{
      tr.addEventListener('click', ()=>selectCase(tr.dataset.caseId));
    });
  }

  document.querySelectorAll('thead th[data-sort]').forEach(th=>{
    const ind = th.querySelector('.sort-ind');
    if(!ind) return;
    if(th.dataset.sort === sortKey){ th.classList.add('sort-active'); ind.textContent = sortDir==='asc'?'↑':'↓'; }
    else { th.classList.remove('sort-active'); ind.textContent = '↕'; }
  });
}

const quickDraftTags = {};
function toggleQuickTag(alertId, tag){
  if(!quickDraftTags[alertId]) quickDraftTags[alertId] = new Set(['note']);
  if(quickDraftTags[alertId].has(tag)) quickDraftTags[alertId].delete(tag);
  else quickDraftTags[alertId].add(tag);
  if(quickDraftTags[alertId].size === 0) quickDraftTags[alertId].add('note');
  document.querySelectorAll('.tag-btn').forEach(b=>{
    if(b.dataset.qtag) b.classList.toggle('on', quickDraftTags[alertId].has(b.dataset.qtag));
  });
}
function postQuickComment(alertId){
  const ta = document.getElementById('quickComment_'+alertId);
  const text = (ta.value||'').trim();
  if(!text) return toast('Comment cannot be empty');
  const pin = document.getElementById('quickPin_'+alertId)?.checked || false;
  const tags = [...(quickDraftTags[alertId] || new Set(['note']))];
  if(!COMMENTS[alertId]) COMMENTS[alertId] = [];
  COMMENTS[alertId].unshift({author:'A. Khan',initials:'AK',time:nowLabel(),body:text,tags,pinned:pin});
  quickDraftTags[alertId] = new Set(['note']);
  toast('Comment posted');
  renderAlertDetails();

  // Push comment to Worker
  if (liveMode) {
    fetch(`${WORKER_URL}/api/alerts/${alertId}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        author: 'A. Khan',
        initials: 'AK',
        body: text,
        tags: tags,
        pinned: pin,
      }),
    }).catch(e => console.warn('Comment push failed', e));
  }
}
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';

function togglePin(alertId, idx){
  const c = COMMENTS[alertId]?.[idx];
  if(!c) return;
  c.pinned = !c.pinned;
  renderAlertDetails();
}
function deleteComment(alertId, idx){
  if(!COMMENTS[alertId]) return;
  if(!confirm('Delete this comment?')) return;
  COMMENTS[alertId].splice(idx,1);
  renderAlertDetails();
}

function commentItemHTML(cmt, alertId){

  const initial = cmt.initials || cmt.author.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  const tagsHTML = (cmt.tags||[]).map(t=>`<span class="ctag ${t}">${t}</span>`).join('');
  const idx = (COMMENTS[alertId]||[]).indexOf(cmt);
  return `

function buildPlatformCards(io, ti){
  if(!ti.platforms || !Object.keys(ti.platforms).length){
    return `<div class="muted" style="font-size:11.5px;padding:8px 4px">${esc(ti.reason||'No TI data available.')}</div>`;
  }
  const p = ti.platforms, out = [];
  if(p.virustotal){
    const v = p.virustotal;
    const pct = v.total ? Math.round(v.detections/v.total*100) : 0;
    const color = pct>20?'var(--crit)':pct>5?'var(--high)':'var(--low)';
    const cls = pct>20?'bad':pct>5?'warn':'good';
    const chips = v.vendors.slice(0,8).map(x=>`<span>${esc(x)}</span>`).join('')+(v.vendors.length>8?`<span class="ok">+${v.vendors.length-8}</span>`:'');
    out.push(platformRow('VirusTotal','vt','VT',`${v.detections}/${v.total}`,cls,`Last scan ${esc(v.lastScan)}`,pct,color,chips,null));
  }
  if(p.abuseipdb){
    const ab = p.abuseipdb;
    if(ab.confidence===null||ab.confidence===undefined) out.push(platformRow('AbuseIPDB','abuse','AB','n/a','neutral',esc(ab.note||'Not applicable'),null,null,null,null));
    else {
      const c = ab.confidence;
      const color = c>=75?'var(--crit)':c>=25?'var(--high)':'var(--low)';
      const cls = c>=75?'bad':c>=25?'warn':'good';
      out.push(platformRow('AbuseIPDB','abuse','AB',`${c}%`,cls,`${ab.reports} reports · ${esc(ab.isp||'')}`,c,color,null,ab.isTor?`<span>TOR exit</span>`:null));
    }
  }
  if(p.otx){
    const o = p.otx;
    out.push(platformRow('AlienVault OTX','otx','OTX',`${o.pulses} pulses`,o.pulses>15?'bad':o.pulses>0?'warn':'good',
      o.pulses>0?`${o.pulses} pulse(s)${o.families.length?' · '+esc(o.families.join(', ')):''}`:'No pulses',null,null,null,null));
  }
  if(p.shodan){
    const s = p.shodan;
    out.push(platformRow('Shodan','shodan','SH',s.vulns?`${s.vulns} vuln`:'Clean',s.vulns>0?'warn':'neutral',
      `${esc(s.org)} · Ports: ${s.ports.join(', ')}`,null,null,null,null));
  }
  if(p.greynoise){
    const g = p.greynoise;
    const cls = g.classification==='malicious'?'bad':g.classification==='benign'?'good':'warn';
    out.push(platformRow('GreyNoise','greynoise','GN',g.classification,cls,
      `Actor: ${esc(g.actor)}`,null,null,null,g.tags.map(t=>`<span>${esc(t)}</span>`).join('')));
  }
  if(p.urlvoid){
    const u = p.urlvoid;
    const cls = u.detections>5?'bad':u.detections>0?'warn':'good';
    out.push(platformRow('URLVoid','urlvoid','UV',`${u.detections}/${u.engineCount}`,cls,
      `Scanned across ${u.engineCount} engines`,null,null,
      u.engines.slice(0,8).map(x=>`<span>${esc(x)}</span>`).join(''),null));
  }
  if(p.threatfox){
    const t = p.threatfox;
    out.push(platformRow('ThreatFox','threatfox','TF',t.iocCount>0?`${t.iocCount} IOC`:'Clean',t.iocCount>0?'bad':'good',
      t.iocCount>0?`${esc(t.malware)} · ${esc(t.firstSeen)}`:'No IOCs',null,null,null,null));
  }
  if(p.hybrid){
    const h = p.hybrid;
    const cls = h.score>=70?'bad':h.score>=40?'warn':'good';
    const color = h.score>=70?'var(--crit)':h.score>=40?'var(--high)':'var(--low)';
    out.push(platformRow('Hybrid Analysis','hybrid','HA',`${h.score}/100`,cls,
      `${esc(h.family)} · ${esc(h.fileName)}`,h.score,color,null,
      h.sandboxTags.map(t=>`<span>${esc(t)}</span>`).join('')));
  }
  if(p.whois){
    const w = p.whois;
    out.push(platformRow('WHOIS','urlvoid','WH',`${esc(w.age)}`,w.age.includes('days')?'bad':'neutral',
      `${esc(w.registrar)} · ${esc(w.created)}`,null,null,null,null));
  }
  return out.join('');
}
function buildIOCCard(io){
  const ti = getTI(io.field, io.value);
  if(!ti) return '';
  const cls = ti.verdict;
  const key = io.field+'|'+io.value;
  const isOpen = openIOCs.has(key);
  const icon = io.field==='hash'?'⬢':io.field==='domain'?'◇':'○';
  const count = ti.platforms ? Object.keys(ti.platforms).length : 0;
  return `
    <div class="ioc ${cls} ${isOpen?'open':''}">
      <div class="ioc-head" ${count>0?`onclick="toggleIOC('${esc(key).replace(/'/g,"\\'")}')"`:''}>
        <span class="ico">${icon}</span>
        <div style="flex:1;min-width:0">
          <div class="val">${esc(io.value)}</div>
          <div class="field-name">${FIELD_LABELS[io.field]||io.field}${count>0?` · ${count} sources`:''}</div>
        </div>
        <span class="ioc-verdict ${cls}">${cls}</span>
        ${count>0?'<span class="ioc-arrow">▼</span>':''}
      </div>
      ${isOpen?`<div class="ioc-body">${buildPlatformCards(io,ti)}</div>`:''}
    </div>`;
}
function renderTITab(a){
  const iocs = getIOCs(a);
  if(!iocs.length) return '<div class="muted" style="font-size:12px">No IOCs associated with this alert.</div>';
  return iocs.map(buildIOCCard).join('')+`
    <div style="display:flex;gap:6px;margin-top:12px">
      <button class="btn primary" style="flex:1" onclick="correlateByTI()">Correlate Similar Alerts</button>
      <button class="btn" onclick="toast('Re-querying TI providers…')">Refresh</button>
    </div>`;
}
function renderMITRETab(a){
  const tactics = {};
  a.mitre.forEach(m=>{
    const t = MITRE[m]?.tactic||'Unknown';
    t.split(' / ').forEach(tt=>{ if(!tactics[tt]) tactics[tt]=[]; tactics[tt].push(m); });
  });
  return `
    <div class="section">
      <h4 class="section-title">Techniques <span class="meta">${a.mitre.length}</span></h4>
      ${a.mitre.map(m=>{
        const info = MITRE[m]||{name:'Unknown',tactic:'—'};
        return `<div class="mitre-item">
          <div class="mitre-head"><span class="mitre-id">${esc(m)}</span><span class="mitre-tactic">${esc(info.tactic)}</span></div>
          <div class="mitre-name">${esc(info.name)}</div>
          <div class="mitre-meta">${esc(a.rule)} · ${esc(a.sensor)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="section">
      <h4 class="section-title">Tactics</h4>
      <div class="chip-list">${Object.keys(tactics).map(t=>`<span class="chip" style="cursor:default">${esc(t)} · ${tactics[t].length}</span>`).join('')}</div>
    </div>`;
}
function buildRawFields(a){
  return {
    alert_id:a.id, rule_name:a.rule, severity:a.sev.toUpperCase(),
    risk_score:a.risk, sensor_type:a.sensor, ingest_time:a.created,
    event_time:a.created, source_ip:a.src_ip||'—', destination_ip:a.dst_ip||'—',
    user_account:a.user, hostname:a.host, file_hash_sha256:a.hash||'—',
    domain_name:a.domain||'—', mitre_technique:a.mitre.join(', '),
    mitre_tactic:[...new Set(a.mitre.map(m=>MITRE[m]?.tactic).filter(Boolean))].join(', '),
    status:a.status, tenant:a.company, analyst:'A. Khan',
    comment_count:String((COMMENTS[a.id]||[]).length),
    case_id: cases[a.id]?.caseId || '—'
  };
}
function renderFieldsTab(a){
  const fields = buildRawFields(a);
  return `<div class="section">
      <h4 class="section-title">Raw Fields <span class="meta">${Object.keys(fields).length}</span></h4>
      <table class="raw-table"><tbody>
        ${Object.entries(fields).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}
function buildRawLog(a){
  const evt = {
    '@timestamp': a.created,
    'event':{kind:'alert',category:a.sensor.toLowerCase(),severity:a.risk},
    'rule':{id:a.id,name:a.rule,severity:a.sev,risk_score:a.risk},
    'source':{ip:a.src_ip}, 'destination':{ip:a.dst_ip},
    'user':{name:a.user,domain:'CORP'}, 'host':{name:a.host},
    'threat':{framework:'MITRE ATT&CK',technique:a.mitre},
    'tags':['soc','correlated',a.sensor.toLowerCase()]
  };
  if(a.hash) evt['file'] = {hash:{sha256:a.hash}};
  if(a.domain) evt['dns'] = {question:{name:a.domain,type:'A'}};
  const cef = `CEF:0|Corp-Tech|${a.sensor}|1.0|${a.id}|${a.rule}|${a.risk}|src=${a.src_ip} dst=${a.dst_ip} suser=${a.user} dhost=${a.host}`;
  return {json: JSON.stringify(evt, null, 2), cef};
}
function renderLogTab(a){
  const {json,cef} = buildRawLog(a);
  const colored = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)":/g,'<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>')
    .replace(/: (\d+)/g,': <span class="n">$1</span>');
  return `
    <div class="section">
      <h4 class="section-title">Raw JSON</h4>
      <div class="raw-log"><button class="copy-btn" onclick="copyLog(${JSON.stringify(json)})">Copy</button>${colored}</div>
    </div>
    <div class="section">
      <h4 class="section-title">Raw CEF</h4>
      <div class="raw-log" style="white-space:pre-wrap;word-break:break-all">
        <button class="copy-btn" onclick="copyLog(${JSON.stringify(cef)})">Copy</button>${esc(cef)}</div>
    </div>`;
}
function copyLog(text){ navigator.clipboard?.writeText(text); toast('Copied'); }
function switchTab(t){ activeTab = t; updateTabUI(); renderAlertDetails(); }
function toggleIOC(key){ openIOCs.has(key)?openIOCs.delete(key):openIOCs.add(key); renderAlertDetails(); }

function renderAlertDetails(){
  const a = ALERTS.find(x=>x.id===selectedAlertId);
  if(!a) return;
  document.getElementById('panelTitle').textContent = `${a.id} · ${a.company}`;
  const body = document.getElementById('panelBody');
  if(activeTab==='overview') body.innerHTML = renderOverviewTab(a);
  else if(activeTab==='case') body.innerHTML = renderCaseTab(a);
  else if(activeTab==='ti') body.innerHTML = renderTITab(a);
  else if(activeTab==='mitre') body.innerHTML = renderMITRETab(a);
  else if(activeTab==='fields') body.innerHTML = renderFieldsTab(a);
  else if(activeTab==='log') body.innerHTML = renderLogTab(a);
  wirePanelEvents();
  if(quickDraftTags[a.id]) document.querySelectorAll('.tag-btn').forEach(b=>{
    if(b.dataset.qtag) b.classList.toggle('on', quickDraftTags[a.id].has(b.dataset.qtag));
  });
  const qta = document.getElementById('quickComment_'+a.id);
  if(qta){
    qta.addEventListener('keydown', e=>{
      if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); postQuickComment(a.id); }
    });
    qta.addEventListener('input', ()=>autoGrow(qta));
  }
}

function renderCaseDetails(){
  const c = Object.values(cases).find(x=>x.caseId===selectedCaseId);
  if(!c) return;
  document.getElementById('panelTitle').textContent = c.caseId;
  const a = ALERTS.find(x=>x.id===c.alertId);
  document.getElementById('panelBody').innerHTML = a ? renderCaseTab(a) : '<div class="muted">Case alert not found.</div>';
  wirePanelEvents();
}

/* ==================== 18. PANEL EVENTS ==================== */
function wirePanelEvents(){
  document.querySelectorAll('.toggle-group[data-alert] button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const a = ALERTS.find(x=>x.id===selectedAlertId);
      if(!a) return;
      a.status = b.dataset.status;
      toast(`${a.id} → ${a.status}`);
      renderView(); renderAlertDetails();
      pushUpdate(a.id, { status: a.status });
    });
  });
  document.querySelectorAll('.toggle-group[data-case] button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const c = Object.values(cases).find(x=>x.caseId===b.closest('[data-case]').dataset.case);
      if(!c) return;
      c.status = b.dataset.caseStatus;
      toast(`${c.caseId} → ${c.status}`);
      renderView(); renderAlertDetails();
    });
  });
  document.querySelectorAll('.verdict-grid button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const a = ALERTS.find(x=>x.id===selectedAlertId);
      if(!a) return;
      setVerdict(a, b.dataset.verdict);
      renderAlertDetails();
    });
  });
}

/* ==================== 19. VERDICT ==================== */
function setVerdict(a, verdict){
  const existing = cases[a.id];
  if(verdict === 'True Positive'){
    if(!existing){
      caseCounter++;
      const year = new Date().getFullYear();
      const caseId = `CASE-${year}-${String(caseCounter).padStart(4,'0')}`;
      const linked = ALERTS.filter(x =>
        x.id !== a.id && (x.host === a.host || x.user === a.user ||
          (x.hash && x.hash === a.hash) || (x.domain && x.domain === a.domain))
      ).map(x=>x.id).slice(0,8);
      cases[a.id] = {
        caseId, alertId:a.id, company:a.company, title:`${a.rule} on ${a.host}`,
        sev:a.sev, created:a.created, status:'Open', owner:'A. Khan', verdict:'True Positive',
        priority: a.sev==='Critical'?'P1 - Critical':a.sev==='High'?'P2 - High':'P3 - Medium',
        mitre:[...a.mitre], linked,
        description:`Confirmed ${a.rule.toLowerCase()} affecting ${a.user} on ${a.host}.`,
        timeline:[
          {time:'now', text:`Case ${caseId} opened by A. Khan`},
          {time:'now', text:`Alert ${a.id} marked True Positive`},
          {time:'now', text:`${linked.length} correlated alert(s) linked`}
        ]
      };
      toast(`Case ${caseId} created · ${linked.length} linked`);
    } else toast(`${existing.caseId} retained`);
    a.status = 'Escalated';
  } else {
    if(existing){ existing.verdict = verdict; toast(`Verdict → ${verdict}`); }
    else toast(`Verdict: ${verdict}`);
    if(verdict==='False Positive'||verdict==='Benign') a.status = 'Closed';
    else if(verdict==='Suspicious') a.status = 'In Progress';
  }
  renderView();
  updateTabUI();

  // Push live
  pushUpdate(a.id, {
    status: a.status,
    verdict: verdict,
    owner: 'A. Khan',
  });
}

/* ==================== 20. MAIL MODAL ==================== */
const RECIPIENTS = [
  {id:'soc',   label:'SOC Team',         email:'soc-team@corp.com',    ico:'◈'},
  {id:'ir',    label:'Incident Response',email:'ir@corp.com',          ico:'◉'},
  {id:'tier2', label:'Tier 2',           email:'tier2@corp.com',       ico:'◎'},
  {id:'lead',  label:'SOC Lead',         email:'soc-lead@corp.com',    ico:'○'},
  {id:'ciso',  label:'CISO',             email:'ciso@corp.com',        ico:'◐'},
  {id:'mgmt',  label:'IT Management',    email:'it-mgmt@corp.com',     ico:'◇'},
  {id:'legal', label:'Legal',            email:'legal@corp.com',       ico:'⬢'}
];
const selectedRecipients = new Set(['soc','ir']);

function openMailModal(alertId, template){
  const a = ALERTS.find(x=>x.id===alertId);
  if(!a) return;
  document.getElementById('mailSubtitle').textContent = `${a.id} · ${a.rule} · ${a.sev}`;
  renderRecipientChips();
  document.getElementById('mailTo').value = '';
  document.getElementById('mailCc').value = '';
  document.getElementById('mailPriority').value = a.sev==='Critical'?'P1':a.sev==='High'?'P2':'P3';
  document.getElementById('mailBackdrop').classList.add('open');
  setMailTemplate(template || 'escalate', a);
  updateMailPreview();
  ['mailTo','mailCc','mailPriority','mailSubject'].forEach(id=>{
    const e = document.getElementById(id);
    e.oninput = e.onchange = () => updateMailPreview();
  });
  document.getElementById('mailBody').oninput = () => updateMailPreview();
  document.querySelectorAll('.att-item input').forEach(cb => cb.onchange = () => updateMailPreview());
  document.querySelectorAll('#templateSelect .tmpl-btn').forEach(b => {
    b.onclick = () => setMailTemplate(b.dataset.tmpl, a);
  });
  document.querySelectorAll('#recipientChips .rcpt-chip').forEach(c => {
    c.onclick = () => {
      const id = c.dataset.rcpt;
      selectedRecipients.has(id) ? selectedRecipients.delete(id) : selectedRecipients.add(id);
      renderRecipientChips(); updateMailPreview();
    };
  });
}
function closeMailModal(){ document.getElementById('mailBackdrop').classList.remove('open'); }
function renderRecipientChips(){
  document.getElementById('recipientChips').innerHTML = RECIPIENTS.map(r => `
    <div class="rcpt-chip ${selectedRecipients.has(r.id)?'on':''}" data-rcpt="${r.id}">
      ${r.ico} ${r.label}
    </div>`).join('');
}
function recipientEmails(){
  const chips = RECIPIENTS.filter(r=>selectedRecipients.has(r.id)).map(r=>r.email);
  const manual = (document.getElementById('mailTo').value||'').split(',').map(x=>x.trim()).filter(Boolean);
  return [...chips, ...manual];
}
function setMailTemplate(tmpl, a){
  document.querySelectorAll('#templateSelect .tmpl-btn').forEach(b=>b.classList.toggle('on', b.dataset.tmpl===tmpl));
  const c = cases[a.id];
  const caseLine = c ? `Case: ${c.caseId} (${c.priority})\n` : '';
  const badIOCs = getIOCs(a).map(io=>{
    const ti = getTI(io.field, io.value);
    return ti && ti.verdict === 'malicious' ? `${io.value} (${io.field}, VT:${ti.platforms?.virustotal?.detections||'?'}/${ti.platforms?.virustotal?.total||'?'})` : null;
  }).filter(Boolean);

  const subjects = {
    escalate: `[${a.sev.toUpperCase()}] Escalation — ${a.rule} · ${a.host}`,
    incident: `[ACTIVE INCIDENT] ${a.rule} on ${a.host}`,
    confirm:  `[Confirmed TP] ${a.rule} — ${a.host}`,
    fp:       `[False Positive] ${a.id} — ${a.rule}`
  };
  const bodies = {
    escalate:`Escalating alert for analyst review and Tier 2 action.

ALERT SUMMARY
-------------
Alert ID     : ${a.id}
Rule         : ${a.rule}
Severity     : ${a.sev}   (risk ${a.risk}/100)
Sensor       : ${a.sensor}
Created      : ${a.created}
${caseLine}User         : ${a.user}
Host         : ${a.host}
Source IP    : ${a.src_ip || '—'}
Destination  : ${a.dst_ip || '—'}
${a.hash ? `File Hash    : ${a.hash}\n` : ''}${a.domain ? `Domain       : ${a.domain}\n` : ''}
MITRE ATT&CK : ${a.mitre.join(', ')}

THREAT INTEL
------------
${badIOCs.length ? badIOCs.join('\n') : 'No malicious IOCs flagged.'}

ACTION REQUIRED
---------------
- Verify the alert context in the SIEM
- Correlate against related alerts / hosts
- Contain the affected asset if confirmed
- Update the case in the triage console

Regards,
A. Khan · SOC Tier 1`,
    incident:`ACTIVE INCIDENT NOTIFICATION

${caseLine || 'Case not yet created.\n'}Alert  : ${a.id} (${a.rule})
Severity: ${a.sev} — risk ${a.risk}/100
Host    : ${a.host}
User    : ${a.user}
Source  : ${a.src_ip} → ${a.dst_ip}

IOCs: ${badIOCs.join(' | ') || 'none flagged'}

This alert requires immediate triage.

— A. Khan`,
    confirm:`Confirmed True Positive — response tracking.

Alert   : ${a.id}
${caseLine}Rule    : ${a.rule}
Severity: ${a.sev}
Host    : ${a.host}
User    : ${a.user}

Evidence: ${badIOCs.length ? badIOCs.join(', ') : 'see attached log'}

— A. Khan`,
    fp:`Marked False Positive.

Alert   : ${a.id}
Rule    : ${a.rule}
Reason  : Analyst determined no adversary activity.
Evidence: Review attached log / fields.

— A. Khan`
  };
  document.getElementById('mailSubject').value = subjects[tmpl];
  document.getElementById('mailBody').value = bodies[tmpl];
  updateMailPreview();
}
function updateMailPreview(){
  const to = recipientEmails();
  const attach = [];
  if(document.getElementById('attRawLog').checked) attach.push('Raw JSON');
  if(document.getElementById('attRawFields').checked) attach.push('Fields');
  if(document.getElementById('attTI').checked) attach.push('TI summary');
  if(document.getElementById('attComments').checked) attach.push('Comments');
  if(document.getElementById('attMitre').checked) attach.push('MITRE');
  if(document.getElementById('attLinked').checked) attach.push('Linked');
  document.getElementById('pvTo').textContent = to.join(', ') || '—';
  document.getElementById('pvSubject').textContent = document.getElementById('mailSubject').value || '—';
  document.getElementById('pvAttach').textContent = attach.join(' · ') || 'none';
  document.getElementById('pvBody').textContent = document.getElementById('mailBody').value || '—';
}
function sendMail(){
  const to = recipientEmails();
  if(!to.length) return toast('Add at least one recipient');
  const a = ALERTS.find(x=>x.id===selectedAlertId);
  if(!a) return;
  const priority = document.getElementById('mailPriority').value;
  toast(`Email sent to ${to.length} recipient(s) · ${priority}`);
  a.status = 'Escalated';
  if(cases[a.id]) cases[a.id].timeline.push({time:'now', text:`Escalation email sent (${priority})`});
  if(!COMMENTS[a.id]) COMMENTS[a.id] = [];
  COMMENTS[a.id].unshift({
    author:'A. Khan', initials:'AK', time:nowLabel(),
    body:`Escalation email sent to: ${to.join(', ')}\nPriority: ${priority} — "${document.getElementById('mailSubject').value}"`,
    tags:['action','evidence'], pinned:true
  });
  closeMailModal();
  renderView(); renderAlertDetails();
}
function saveAsDraft(){ toast('Draft saved'); }
function escalateAndMail(alertId){
  const a = ALERTS.find(x=>x.id===alertId);
  if(!a) return;
  if(!cases[a.id]) setVerdict(a, 'True Positive');
  else a.status = 'Escalated';
  openMailModal(alertId, 'escalate');
}

/* ==================== 21. MISC ==================== */
function correlateByTI(){
  const a = ALERTS.find(x=>x.id===selectedAlertId);
  if(!a) return;
  const badVals = new Set();
  getIOCs(a).forEach(io=>{
    const ti = getTI(io.field, io.value);
    if(ti && ti.verdict === 'malicious') badVals.add(io.value);
  });
  if(!badVals.size) return toast('No malicious IOCs.');
  const matches = ALERTS.filter(x=>x.id!==a.id && getIOCs(x).some(io=>badVals.has(io.value)));
  if(!matches.length) return toast('No other alerts share these IOCs.');
  document.querySelectorAll('tr.ti-match').forEach(r=>r.classList.remove('ti-match'));
  matches.forEach(m=>{
    const r = document.querySelector(`tr[data-id="${m.id}"]`);
    if(r) r.classList.add('ti-match');
  });
  toast(`Highlighted ${matches.length} correlated alert(s).`);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('mailBackdrop').classList.contains('open'))
    closeMailModal();
});

/* ==================== BOOT ==================== */
renderView();
updateLiveIndicator(0);
fetchLiveAlerts();
setInterval(fetchLiveAlerts, 30000);

// Manual refresh with Ctrl+Shift+R
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key === 'R') {
    e.preventDefault();
    toast('Refreshing from Worker…');
    fetchLiveAlerts();
  }
});
</script>
